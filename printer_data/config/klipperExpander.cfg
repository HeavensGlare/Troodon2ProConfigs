[mcu expander]
serial: /dev/serial/by-id/usb-Klipper_stm32f042x6_160024001653304B4D323431-if00
restart_method: command

[fan_generic TheFilter]
pin: expander:PA0
max_power: 1.0
shutdown_speed: 0.0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.5
off_below: 0.10

[fan_generic Exhaust]
pin: expander:PA1
max_power: 1.0
shutdown_speed: 0.0
cycle_time: 0.010
hardware_pwm: False
kick_start_time: 0.5
off_below: 0.10

[heater_generic chamber]
gcode_id: C
# We use PA2 (Mosfet 2) as a dummy pin.
# IMPORTANT: Ensure NOTHING is plugged into the PA2 screw terminal!
heater_pin: expander:PA2
max_power: 1.0
sensor_type: Generic 3950
sensor_pin: expander:PA6
control: watermark
max_delta: 2.0
min_temp: 0
max_temp: 80

# This section prevents Klipper from stopping the print due to slow heating
[verify_heater chamber]
max_error: 120
check_gain_time: 240
hysteresis: 50
heating_gain: 1

#[output_pin mosfet3]
#pin: expander:PA3
#pwm: true
#cycle_time: 0.010
#value: 0
#shutdown_value: 0

# Status LED lights when klipper connects 
[static_digital_output onboardLED]
pins: !expander:PA4


[neopixel expanderPixel]
pin: expander:PB1
chain_count: 1
initial_RED: 0.9
initial_GREEN: 0.3
initial_BLUE: 0.0

# Other Pins
# T0 = expander:PA6
# T1 = expander:PA5
# GPIO = expander:PA7
