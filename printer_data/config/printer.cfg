# fan_speed: 0.8

#####################################################################
#   LED Control
#####################################################################

## Chamber Lighting - HE2 Connector (Optional)

[output_pin case_light]
pin: PE6
pwm:false
shutdown_value: 0
value:1


##################################
# Bed Mesh
##################################

[bed_mesh]
speed: 300
horizontal_move_z: 5
mesh_min: 30, 20
mesh_max: 325, 300
probe_count: 25, 25
adaptive_margin: 5
mesh_pps: 3, 3
algorithm: bicubic
#bicubic_tension: 0.2
move_check_distance: 5
split_delta_z: .025
fade_start: 1
fade_end: 10
fade_target: 0


