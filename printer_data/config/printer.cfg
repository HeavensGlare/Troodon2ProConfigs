mesh_main_direction: x
mesh_runs: 2

# --- NEW CONTACT SETTINGS ---
contact_max_hotend_temperature: 180 # Safety limit. We will probe at 150C.
home_xy_position: 175, 175          # Center of bed (Change to 150,150 if 300mm build)
home_z_hop: 5
home_z_hop_speed: 30
home_xy_move_speed: 300

